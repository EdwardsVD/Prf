    /* ---------------- media ---------------- */
    function mediaById(id) { for (var i = 0; i < S.media.length; i++) if (S.media[i].id === id) return S.media[i]; return null; }
    function clipById(id) { for (var i = 0; i < S.clips.length; i++) if (S.clips[i].id === id) return S.clips[i]; return null; }
    function textById(id) { for (var i = 0; i < S.texts.length; i++) if (S.texts[i].id === id) return S.texts[i]; return null; }

    function typeOfFile(name) {
      var n = String(name || '').toLowerCase();
      if (/\.(mp4|webm|mov|m4v|mkv|avi|ogv|3gp|mpeg|mpg)$/.test(n)) return 'video';
      if (/\.(mp3|wav|m4a|ogg|aac|flac|opus|wma)$/.test(n)) return 'audio';
      if (/\.(png|jpe?g|webp|gif|bmp|avif|svg)$/.test(n)) return 'image';
      return null;
    }

    function probeDuration(el, cb) {
      var done = false;
      function finish(d) { if (!done) { done = true; cb(isNum(d) && d > 0 ? d : 0); } }
      if (el.readyState >= 1 && isNum(el.duration) && el.duration > 0) { finish(el.duration); return; }
      el.addEventListener('loadedmetadata', function () { finish(el.duration); });
      el.addEventListener('durationchange', function () { if (isNum(el.duration) && el.duration > 0) finish(el.duration); });
      el.addEventListener('error', function () { finish(0); });
      setTimeout(function () { finish(el.readyState >= 1 && isNum(el.duration) ? el.duration : 0); }, 4500);
    }

    function makeThumbs(url, dur, cb) {
      var out = [];
      try {
        var v = document.createElement('video');
        v.muted = true;
        v.src = url;
        v.preload = 'auto';
        v.style.cssText = 'position:fixed;left:-9999px;width:2px;height:2px;opacity:0;pointer-events:none;';
        document.body.appendChild(v);
        var times = [0.06, 0.28, 0.55, 0.82];
        var i = 0;
        function cleanup() { try { v.removeAttribute('src'); v.load(); } catch (e) { } setTimeout(function () { try { if (v.parentNode) v.parentNode.removeChild(v); } catch (e) { } }, 120); }
        function grab() {
          if (out.length >= 4 || i >= times.length) { cleanup(); cb(out); return; }
          var t = clamp(times[i] * dur, 0, Math.max(0, dur - 0.1));
          try { v.currentTime = t; } catch (e) { i++; setTimeout(grab, 30); return; }
          v.onseeked = function () {
            try {
              if (v.videoWidth && v.videoHeight) {
                var c = document.createElement('canvas');
                c.width = 160; c.height = 90;
                c.getContext('2d').drawImage(v, 0, 0, 160, 90);
                out.push(c.toDataURL('image/jpeg', 0.55));
              }
            } catch (e) { }
            i++;
            setTimeout(grab, 40);
          };
        }
        v.addEventListener('loadeddata', function () { grab(); });
        v.addEventListener('error', function () { cleanup(); cb(out); });
        setTimeout(function () { if (i === 0 && out.length === 0) { cleanup(); cb(out); } }, 7000);
      } catch (e) { cb(out); }
    }

    function afterLoad(m) {
      for (var i = 0; i < S.clips.length; i++) {
        var c = S.clips[i];
        if (c.mediaId !== m.id) continue;
        if (c._pending) {
          c.out = m.duration > 0 ? m.duration : (c.out || 4);
          c.end = c.start + Math.max(0.2, (c.out - c.in) / c.rate);
          delete c._pending;
        }
      }
      S.dirty = true;
      recompute();
      renderAll();
      markDirty();
      toast('Media dimuat: ' + m.name, 'good');
    }

    function makeClip(m, start) {
      var dur = m.duration > 0 ? m.duration : 4;
      var st = isNum(start) ? start : S.total;
      return {
        id: uid(), mediaId: m.id, name: m.name,
        start: st, end: st + Math.max(0.2, dur),
        in: 0, out: dur, rate: 1, vol: 100, mute: false,
        opacity: 100, zoom: 100, rotate: 0, flipH: false, flipV: false,
        filter: defaultFilter(), anim: 'none',
        _pending: m.duration <= 0
      };
    }

    function addFiles(fileList) {
      var files = Array.prototype.slice.call(fileList || []);
      if (!files.length) return;
      files.forEach(function (file) {
        var type = typeOfFile(file.name);
        if (!type) { toast('Format tidak didukung: ' + file.name, 'bad'); return; }
        var url = URL.createObjectURL(file);
        var m = { id: uid(), name: file.name, type: type, url: url, duration: 0, w: 0, h: 0, thumbs: [], img: null, el: null, srcNode: null, missing: false };
        var miss = null;
        for (var i = 0; i < S.media.length; i++) {
          if (S.media[i].missing && S.media[i].name === file.name) { miss = S.media[i]; break; }
        }
        if (miss) {
          m.id = miss.id;
          S.media = S.media.filter(function (x) { return x !== miss; });
          for (var j = 0; j < S.clips.length; j++) if (S.clips[j].mediaId === miss.id) S.clips[j].name = m.name;
        }
        if (type === 'video' || type === 'audio') {
          var el = document.createElement(type === 'video' ? 'video' : 'audio');
          el.preload = 'auto';
          el.src = url;
          el.volume = 1;
          el.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none;';
          document.body.appendChild(el);
          m.el = el;
          probeDuration(el, function (d) {
            m.duration = d;
            if (type === 'video' && d > 0) {
              makeThumbs(url, d, function (th) { m.thumbs = th; renderMediaTab(); });
            }
            afterLoad(m);
          });
        } else {
          var img = new Image();
          img.onload = function () { m.w = img.naturalWidth; m.h = img.naturalHeight; m.img = img; m.duration = 4; afterLoad(m); };
          img.onerror = function () { m.duration = 4; afterLoad(m); };
          img.src = url;
        }
        S.media.push(m);
        S.clips.push(makeClip(m));
        S.dirty = true;
      });
      recompute();
      renderAll();
      markDirty();
      var empty = qs('#v19-empty');
      if (empty && S.clips.length) empty.style.display = 'none';
      var fi = qs('#v19-file');
      if (fi) fi.value = '';
    }

    /* ---------------- timeline ops ---------------- */
    function recompute() {
      S.clips.sort(function (a, b) { return a.start - b.start; });
      S.texts.sort(function (a, b) { return a.start - b.start; });
      var mx = 0;
      for (var i = 0; i < S.clips.length; i++) mx = Math.max(mx, S.clips[i].end);
      for (var j = 0; j < S.texts.length; j++) mx = Math.max(mx, S.texts[j].end);
      S.total = mx;
    }
    function activeClip(t) {
      for (var i = 0; i < S.clips.length; i++) { var c = S.clips[i]; if (t >= c.start - 1e-6 && t < c.end) return c; }
      return null;
    }
    function activeTexts(t) {
      var out = [];
      for (var i = 0; i < S.texts.length; i++) { var x = S.texts[i]; if (t >= x.start - 1e-6 && t < x.end) out.push(x); }
      return out;
    }
    function pushUndo() {
      S.undo.push(JSON.stringify({ clips: S.clips, texts: S.texts }));
      if (S.undo.length > 60) S.undo.shift();
      S.redo = [];
      S.dirty = true;
      updateHeaderBtns();
    }
    function undo() {
      if (!S.undo.length) return;
      S.redo.push(JSON.stringify({ clips: S.clips, texts: S.texts }));
      var snap = JSON.parse(S.undo.pop());
      S.clips = snap.clips; S.texts = snap.texts;
      recompute(); renderAll(); markDirty(); toast('Undo');
    }
    function redo() {
      if (!S.redo.length) return;
      S.undo.push(JSON.stringify({ clips: S.clips, texts: S.texts }));
      var snap = JSON.parse(S.redo.pop());
      S.clips = snap.clips; S.texts = snap.texts;
      recompute(); renderAll(); markDirty(); toast('Redo');
    }
    function splitAt(t) {
      var c = activeClip(t);
      if (!c) return;
      var mT = c.in + (t - c.start) * c.rate;
      if (mT <= c.in + 0.05 || mT >= c.out - 0.05) { toast('Terlalu dekat ke ujung clip', 'bad'); return; }
      pushUndo();
      var c2 = JSON.parse(JSON.stringify(c));
      c2.id = uid();
      c.end = t;
      c2.start = t;
      c2.in = mT;
      S.clips.push(c2);
      recompute(); renderAll(); markDirty();
      toast('Clip di-split');
    }
    function deleteSel() {
      if (!S.sel) return;
      pushUndo();
      if (S.sel.kind === 'clip') S.clips = S.clips.filter(function (c) { return c.id !== S.sel.id; });
      else S.texts = S.texts.filter(function (x) { return x.id !== S.sel.id; });
      S.sel = null;
      recompute(); renderAll(); markDirty();
    }
    function duplicateSel() {
      if (!S.sel) return;
      if (S.sel.kind === 'clip') {
        var c = clipById(S.sel.id);
        if (!c) return;
        pushUndo(); // v0.1.0 fix: undo di-push setelah item dipastikan ada
        var c2 = JSON.parse(JSON.stringify(c));
        c2.id = uid();
        var dur = c.end - c.start;
        c2.start = c.end; c2.end = c.end + dur;
        S.clips.push(c2);
        S.sel = { kind: 'clip', id: c2.id };
      } else {
        var x = textById(S.sel.id);
        if (!x) return;
        pushUndo(); // v0.1.0 fix: sama untuk teks
        var x2 = JSON.parse(JSON.stringify(x));
        x2.id = uid();
        var d2 = x.end - x.start;
        x2.start = x.end; x2.end = x.end + d2;
        S.texts.push(x2);
        S.sel = { kind: 'text', id: x2.id };
      }
      recompute(); renderAll(); markDirty();
      toast('Duplikat dibuat');
    }
    function nudgeSel(dt) {
      if (!S.sel) return false;
      if (S.sel.kind === 'clip') {
        var c = clipById(S.sel.id);
        if (!c) return false;
        var ns = Math.max(0, c.start + dt);
        if (ns === c.start) return false; // v0.1.0 fix: jangan push undo kalau clip tidak benar-benar geser
        pushUndo();
        var dur = c.end - c.start;
        c.start = ns; c.end = ns + dur;
      } else {
        var x = textById(S.sel.id);
        if (!x) return false;
        var ns2 = Math.max(0, x.start + dt);
        if (ns2 === x.start) return false; // v0.1.0 fix: sama untuk teks
        pushUndo();
        var d2 = x.end - x.start;
        x.start = ns2; x.end = ns2 + d2;
      }
      recompute(); renderAll(); markDirty();
      return true;
    }
    function seek(t) {
      S.playhead = clamp(t, 0, Math.max(S.total, 0));
      if (S.playing) setPlaying(false);
      if (S.playhead >= S.total && S.total > 0) S.playhead = S.total;
      updateMediaSeek();
      drawFrame();           // cuma update playhead+canvas, tidak rebuild timeline
    }
    function setPlaying(p) {
      S.playing = !!p;
      if (S.playing) {
        if (S.loopOn && isNum(S.loopA) && S.playhead < S.loopA) S.playhead = S.loopA;
        if (S.playhead >= S.total - 0.001 && S.total > 0) S.playhead = 0;
        ensureActx();
        primePlay();
        startLoop();
      } else {
        qsa('video,audio').forEach(function (el) { try { el.pause(); } catch (e) { } });
        if (!S.rec) stopLoop();   // tidak ada idle loop -> hemat CPU/HP
        drawFrame();
      }
      updateHeaderBtns();
    }
    function togglePlay() {
      S.media.forEach(function (m) { wireAudio(m); });
      setPlaying(!S.playing);
    }
    function primePlay() {
      var c = activeClip(S.playhead);
      if (!c) return;
      var m = mediaById(c.mediaId);
      if (m && m.el) {
        try {
          var target = c.in + (S.playhead - c.start) * c.rate;
          m.el.currentTime = clamp(target, 0, Math.max(0, c.out - 0.01));
          m.el.playbackRate = c.rate;
          m.el.volume = c.mute ? 0 : clamp(c.vol / 100, 0, 1);
          var p = m.el.play();
          if (p && p.catch) p.catch(function () { });
        } catch (e) { }
      }
    }
    function updateMediaSeek() {
      var c = activeClip(S.playhead);
      for (var i = 0; i < S.media.length; i++) {
        var m = S.media[i];
        if (!m.el) continue;
        if (c && c.mediaId === m.id) {
          try {
            var target = c.in + (S.playhead - c.start) * c.rate;
            if (Math.abs(m.el.currentTime - target) > 0.03) m.el.currentTime = clamp(target, 0, Math.max(0, m.duration - 0.01));
            m.el.playbackRate = c.rate;
            m.el.volume = c.mute ? 0 : clamp(c.vol / 100, 0, 1);
          } catch (e) { }
        } else {
          try { m.el.pause(); } catch (e) { }
        }
      }
    }
    function updateMediaPlay() {
      var c = activeClip(S.playhead);
      for (var i = 0; i < S.media.length; i++) {
        var m = S.media[i];
        if (!m.el) continue;
        if (c && c.mediaId === m.id) {
          try {
            var target = c.in + (S.playhead - c.start) * c.rate;
            if (Math.abs(m.el.currentTime - target) > 0.05) m.el.currentTime = clamp(target, 0, Math.max(0, c.out - 0.01));
            m.el.playbackRate = c.rate;
            m.el.volume = c.mute ? 0 : clamp(c.vol / 100, 0, 1);
            if (m.el.paused) { var p = m.el.play(); if (p && p.catch) p.catch(function () { }); }
          } catch (e) { }
        } else {
          try { if (!m.el.paused) m.el.pause(); } catch (e) { }
        }
      }
    }

    /* ---------------- loop A-B ---------------- */
    function setLoopA() {
      S.loopA = S.playhead;
      if (isNum(S.loopB) && S.loopB <= S.loopA) S.loopB = null;
      S.loopOn = true;
      updateLoopBtns();
      renderTimeline();
      toast('Loop A = ' + fmtT(S.loopA, true));
    }
    function setLoopB() {
      S.loopB = S.playhead;
      if (isNum(S.loopA) && S.loopB <= S.loopA) { S.loopA = S.loopB; }
      S.loopOn = true;
      updateLoopBtns();
      renderTimeline();
      toast('Loop B = ' + fmtT(S.loopB, true));
    }
    function toggleLoop() {
      S.loopOn = !S.loopOn;
      updateLoopBtns();
      renderTimeline();
      toast('Loop ' + (S.loopOn ? 'ON' : 'OFF'));
    }
    function clearLoop() {
      S.loopA = null; S.loopB = null; S.loopOn = false;
      updateLoopBtns();
      renderTimeline();
    }
    function updateLoopBtns() {
      var a = qs('#v19-set-a'), b = qs('#v19-set-b'), lp = qs('#v19-loop-btn');
      if (a) a.classList.toggle('on', isNum(S.loopA));
      if (b) b.classList.toggle('on', isNum(S.loopB));
      if (lp) lp.classList.toggle('on', S.loopOn);
    }

    /* ---------------- anim & draw helpers ---------------- */
    function animOf(anim, p) {
      var a = { dx: 0, dy: 0, scale: 1, rot: 0, alpha: 1, blur: 0 };
      var q;
      switch (anim) {
        case 'fade-in': a.alpha = clamp(p / 0.3, 0, 1); break;

    function wireInspector() {
      var host = qs('#v19-right');
      if (!host) return;
      function on(id, ev, fn) { var el = qs('#' + id, host); if (el) el.addEventListener(ev, fn); }
      function rng(id, fn) {
        on(id, 'input', function (e) {
          var v = parseFloat(e.target.value);
          fn(v);
          var valEl = qs('#' + id + '-v', host);
          if (valEl) valEl.textContent = v + (valEl.getAttribute('data-u') || '');
          S.dirty = true;
          markDirty();
        });
      }
      /* bg presets */
      var bgrow = qs('#v19-bg-row', host);
      if (bgrow) {
        var cur = S.bg;
        var curKey = null;
        for (var k in BG_PRESETS) if (BG_PRESETS[k] === cur) curKey = k;
        qsa('button', bgrow).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-bg') === curKey); });
        qsa('button', bgrow).forEach(function (b) {
          b.addEventListener('click', function () {
            S.bg = BG_PRESETS[b.getAttribute('data-bg')];
            S.dirty = true;
            markDirty();
            qsa('button', bgrow).forEach(function (o) { o.classList.toggle('on', o === b); });
          });
        });
      }
      var pq = qs('#v19-pq', host);
      if (pq) pq.addEventListener('change', function (e) { S.pq = e.target.value; S.dirty = true; resizePreview(); markDirty(); toast('Preview: ' + S.pq.toUpperCase()); });
      var snapEl = qs('#v19-snap', host);
      if (snapEl) snapEl.addEventListener('change', function (e) { S.snap = e.target.checked; S.dirty = true; });
      var del = qs('#v19-del', host);
      if (del) del.addEventListener('click', deleteSel);
      var dup = qs('#v19-dup', host);
      if (dup) dup.addEventListener('click', duplicateSel);
      if (S.sel && S.sel.kind === 'clip') {
        var c = clipById(S.sel.id);
        if (!c) return;
        on('v19-c-name', 'input', function (e) { c.name = e.target.value; S.dirty = true; renderTimeline(); });
        on('v19-c-start', 'change', function (e) { var v = parseFloat(e.target.value); if (isNum(v)) { pushUndo(); c.start = Math.max(0, v); c.end = c.start + (c.out - c.in) / c.rate; recompute(); renderAll(); markDirty(); } });
        on('v19-c-in', 'change', function (e) { var v = parseFloat(e.target.value); if (isNum(v)) { pushUndo(); c.in = clamp(v, 0, c.out - 0.05); c.end = c.start + (c.out - c.in) / c.rate; recompute(); renderAll(); markDirty(); } });
        on('v19-c-out', 'change', function (e) { var v = parseFloat(e.target.value); var mm = mediaById(c.mediaId); var maxO = (mm && isNum(mm.duration) && mm.duration > 0) ? mm.duration : 999999; if (isNum(v)) { pushUndo(); c.out = clamp(v, c.in + 0.05, maxO); c.end = c.start + (c.out - c.in) / c.rate; recompute(); renderAll(); markDirty(); } });
        on('v19-c-rate', 'change', function (e) { pushUndo(); c.rate = parseFloat(e.target.value); c.end = c.start + (c.out - c.in) / c.rate; recompute(); renderAll(); markDirty(); });
        on('v19-set-in', 'click', function () { if (S.playhead > c.start && S.playhead < c.end) { pushUndo(); c.in = c.in + (S.playhead - c.start) * c.rate; c.start = S.playhead; recompute(); renderAll(); markDirty(); toast('In point di-set'); } else toast('Playhead harus di dalam clip', 'bad'); });
        on('v19-set-out', 'click', function () { if (S.playhead > c.start && S.playhead < c.end) { pushUndo(); c.out = c.in + (S.playhead - c.start) * c.rate; c.end = S.playhead; recompute(); renderAll(); markDirty(); toast('Out point di-set'); } else toast('Playhead harus di dalam clip', 'bad'); });
        on('v19-split', 'click', function () { splitAt(S.playhead); });
        rng('v19-c-opacity', function (v) { c.opacity = v; });
        rng('v19-c-zoom', function (v) { c.zoom = v; });
        rng('v19-c-rotate', function (v) { c.rotate = v; });
        rng('v19-c-vol', function (v) { c.vol = v; if (c.mute) c.mute = false; updateMediaSeek(); });
        on('v19-c-mute', 'change', function (e) { c.mute = e.target.checked; updateMediaSeek(); S.dirty = true; });
        on('v19-c-fliph', 'change', function (e) { c.flipH = e.target.checked; S.dirty = true; markDirty(); });

      } else if (S.sel && S.sel.kind === 'text') {
        var x = textById(S.sel.id);
        if (!x) return;
        qsa('#v19-tp button', host).forEach(function (b) {
          b.addEventListener('click', function () {

        on('v19-t-start', 'change', function (e) { var v = parseFloat(e.target.value); if (isNum(v)) { pushUndo(); x.start = Math.max(0, v); if (x.end <= x.start) x.end = x.start + 0.5; recompute(); renderAll(); markDirty(); } });
        on('v19-t-end', 'change', function (e) { var v = parseFloat(e.target.value); if (isNum(v)) { pushUndo(); x.end = Math.max(x.start + 0.1, v); recompute(); renderAll(); markDirty(); } });
        rng('v19-t-x', function (v) { x.x = v; });
        rng('v19-t-y', function (v) { x.y = v; });
        rng('v19-t-size', function (v) { x.size = v; });

        on('v19-t-bgc', 'input', function (e) { x.bgColor = e.target.value; S.dirty = true; markDirty(); });
        rng('v19-t-bg', function (v) { x.bg = v; });
        on('v19-t-anim', 'change', function (e) { x.anim = e.target.value; S.dirty = true; markDirty(); });
        on('v19-set-tin', 'click', function () { pushUndo(); x.start = S.playhead; recompute(); renderAll(); markDirty(); toast('Start teks di-set'); });
        on('v19-set-tout', 'click', function () { pushUndo(); x.end = S.playhead; recompute(); renderAll(); markDirty(); toast('End teks di-set'); });
      }
    }

        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',

    function expOpts() {
      var rb = qs('#v19-exp-res .on'), fb = qs('#v19-exp-fps .on'), vb = qs('#v19-exp-vbps .on');
      var w = rb ? parseInt(rb.getAttribute('data-w'), 10) : 1280;
      var h = rb ? parseInt(rb.getAttribute('data-h'), 10) : 720;
      var fps = fb ? parseInt(fb.getAttribute('data-fps'), 10) : 30;
      var vbps = vb ? parseInt(vb.getAttribute('data-vbps'), 10) : 0;
      return { w: Math.min(w, 1920), h: Math.min(h, 1080), fps: Math.min(fps, 60), vbps: vbps };
    }
    function updateExportEstimate() {
      var o = expOpts();
      var vbps = o.vbps || (o.w >= 1920 ? 12000000 : o.w >= 1280 ? 9000000 : 5000000);
      var mb = (vbps + 192000) * S.total / 8 / 1e6;
      var mime = pickMime();
      var fmtTxt = /mp4/.test(mime) ? 'MP4 (video/mp4)' : (mime ? 'WebM (' + mime + ')' : 'default browser');
      var est = qs('#v19-exp-est');
      if (est) est.textContent = 'Estimasi: ~' + mb.toFixed(1) + ' MB - ' + o.w + 'x' + o.h + ' - ' + o.fps + 'fps - ' + fmtTxt + ' - durasi ' + fmtT(S.total, true) + ' (real-time)';
      var f = qs('#v19-exp-fmt');
      if (f) f.textContent = 'Format: ' + fmtTxt + (window.MediaRecorder ? '' : ' - MediaRecorder TIDAK didukung browser ini!');
    }
    function openExport() {
      buildExportModal();
      var md = qs('#v19-export-modal');
      if (S.total <= 0) { toast('Timeline kosong - import video dulu', 'bad'); return; }
      if (S.rec) { toast('Export sedang berjalan', 'bad'); return; }
      md.style.display = 'flex';
      qs('#v19-export-settings').style.display = 'block';
      qs('#v19-export-progress').style.display = 'none';
      qs('#v19-export-result').style.display = 'none';
      updateExportEstimate();
      renderExportHist();
    }
    function closeExport() {
      if (S.rec) { cancelExport(); return; }
      var md = qs('#v19-export-modal');
      if (md) md.style.display = 'none';
    }
    function renderExportHist() {
      var host = qs('#v19-exp-hist');
      if (!host) return;
      try { S.exportHist = JSON.parse(localStorage.getItem(LS_HIST) || '[]'); } catch (e) { S.exportHist = []; }
      if (!S.exportHist.length) { host.innerHTML = '<div class="v19-hint">Belum ada export.</div>'; return; }
      host.innerHTML = S.exportHist.map(function (x, i) {
        return '<div class="row"><a href="' + x.url + '" download="' + esc(x.name) + '">' + esc(x.name) + '</a><span class="d">' + (x.mb || 0).toFixed(1) + 'MB - ' + fmtT(x.dur, false) + ' - ' + (x.mime.indexOf('mp4') !== -1 ? 'MP4' : 'WEBM') + '</span><button class="v19-btn danger" data-hi="' + i + '" style="padding:2px 6px;min-height:22px;font-size:8px;margin-left:auto;">X</button></div>';
      }).join('');
      qsa('[data-hi]', host).forEach(function (b) {
        b.addEventListener('click', function () {
          var i = parseInt(b.getAttribute('data-hi'), 10);
          S.exportHist.splice(i, 1);
          localStorage.setItem(LS_HIST, JSON.stringify(S.exportHist));
          renderExportHist();
        });
      });
    }
    function pushExportHist(name, url, mb, dur, mime) {
      try {
        S.exportHist.unshift({ name: name, url: url, mb: mb, dur: dur, mime: mime, ts: Date.now() });
        if (S.exportHist.length > 4) S.exportHist.pop();
        localStorage.setItem(LS_HIST, JSON.stringify(S.exportHist));
      } catch (e) { }
    }
    function stamp() {
      var d = new Date();
      function p(n) { n = String(n); while (n.length < 2) n = '0' + n; return n; }
      return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
    }
    function startExport() {
      var o = expOpts();
      var mime = pickMime();
      if (!window.MediaRecorder) { toast('Browser tidak mendukung MediaRecorder', 'bad'); return; }
      var vbps = o.vbps || (o.w >= 1920 ? 12000000 : o.w >= 1280 ? 9000000 : 5000000);
      var cvs = document.createElement('canvas');
      cvs.width = o.w; cvs.height = o.h;
      var ctx = cvs.getContext('2d');
      var stream = cvs.captureStream(o.fps);
      var actx = ensureActx();
      var dest = null;
      try { if (actx) dest = actx.createMediaStreamDestination(); } catch (e) { dest = null; }
      S.media.forEach(function (m) { wireAudio(m); });
      if (dest) S.media.forEach(function (m) { if (m.srcNode) { try { m.srcNode.connect(dest); } catch (e) { } } });
      var tracks = stream.getVideoTracks();
      var combined = new MediaStream();
      for (var i = 0; i < tracks.length; i++) combined.addTrack(tracks[i]);
      if (dest) { var at = dest.stream.getAudioTracks(); for (var j = 0; j < at.length; j++) combined.addTrack(at[j]); }
      var rec;
      try { rec = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: vbps, audioBitsPerSecond: 192000 }); }
      catch (e) {
        try { rec = new MediaRecorder(combined, { videoBitsPerSecond: vbps, audioBitsPerSecond: 192000 }); mime = rec.mimeType || ''; }
        catch (e2) { toast('Gagal membuat recorder', 'bad'); return; }
      }
      var chunks = [];
      var cancelled = false;
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        S.media.forEach(function (m) { if (m.srcNode && dest) { try { m.srcNode.disconnect(dest); } catch (e) { } } });
        setPlaying(false);
        S.rec = null;
        if (cancelled) {
          var pp = qs('#v19-export-progress');
          if (pp) pp.style.display = 'none';
          var ss = qs('#v19-export-settings');
          if (ss) ss.style.display = 'block';
          toast('Export dibatalkan');
          return;
        }
        var blob = new Blob(chunks, { type: mime || 'video/mp4' });
        var url = URL.createObjectURL(blob);
        var ext = /mp4/.test(mime) ? 'mp4' : 'webm';
        var name = 'video-editor-' + stamp() + '.' + ext;
        var mb = blob.size / 1e6;
        pushExportHist(name, url, mb, S.total, mime);
        var res = qs('#v19-export-result');
        qs('#v19-export-progress').style.display = 'none';
        res.style.display = 'block';
        var info = qs('#v19-exp-resinfo');
        info.textContent = fmtT(S.total, true) + ' - ' + o.w + 'x' + o.h + ' @' + o.fps + 'fps - ' + mb.toFixed(1) + ' MB - ' + (/mp4/.test(mime) ? 'MP4' : 'WebM');
        var dl = qs('#v19-exp-dl');
        dl.href = url;
        dl.download = name;
        dl.textContent = 'DOWNLOAD ' + (/mp4/.test(mime) ? 'MP4' : 'WEBM');
        renderExportHist();
        toast('Export selesai!', 'good');
      };
      rec.onerror = function (e) { toast('Error recording: ' + ((e.error && e.error.name) || 'unknown'), 'bad'); };
      S.rec = { rec: rec, cvs: cvs, ctx: ctx, dest: dest, cancelled: false };
      if (actx && actx.state === 'suspended') actx.resume();
      qs('#v19-export-settings').style.display = 'none';
      qs('#v19-export-result').style.display = 'none';
      qs('#v19-export-progress').style.display = 'block';
      qs('#v19-exp-bar').style.width = '0%';
      S.playhead = 0;
      S.playing = true;
      S.lastT = 0;
      startLoop();
      rec.start(250);
    }
    function cancelExport(silent) {
      if (!S.rec) return;
      S.rec.cancelled = true;
      try { if (S.rec.rec.state !== 'inactive') S.rec.rec.stop(); } catch (e) { }
      setPlaying(false);
      var p = qs('#v19-export-progress');
      if (p) p.style.display = 'none';
      var s = qs('#v19-export-settings');
      if (s) s.style.display = 'block';
      if (!silent) toast('Export dibatalkan');
    }
    function tickExport() {
      if (!S.rec || !S.rec.rec) return;
      drawComposition(S.playhead, S.rec.ctx, S.rec.cvs.width, S.rec.cvs.height);
      /* preview ikut dari canvas export (hemat) */
      if (PV.ctx && PV.cv) PV.ctx.drawImage(S.rec.cvs, 0, 0, S.rec.cvs.width, S.rec.cvs.height, 0, 0, PV.w, PV.h);
      updateTimelineUI();
      var pct = S.total > 0 ? clamp(S.playhead / S.total, 0, 1) : 1;
      var bar = qs('#v19-exp-bar');
      if (bar) bar.style.width = (pct * 100) + '%';
      var t = qs('#v19-exp-t');
      if (t) t.textContent = Math.floor(pct * 100) + '% - ' + fmtT(S.playhead, true) + ' / ' + fmtT(S.total, true);
      var sz = qs('#v19-exp-size');
      if (sz) sz.textContent = '~' + (pct * ((expOpts().vbps || 12000000) + 192000) * S.total / 8 / 1e6).toFixed(1) + ' MB (estimasi)';
      if (S.playhead >= S.total) {
        try { if (S.rec.rec.state !== 'inactive') S.rec.rec.stop(); } catch (e) { }
      }
    }

    /* ---------------- project save/load ---------------- */
    function saveProjectFile() {
      var data = {
        version: '0.1.0', savedAt: Date.now(), bg: S.bg, pq: S.pq,
        media: S.media.map(function (m) { return { id: m.id, name: m.name, type: m.type, duration: m.duration, w: m.w, h: m.h }; }),
        clips: S.clips, texts: S.texts
      };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'video-editor-project.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
      toast('Project disimpan (JSON). Media perlu di-import ulang saat dibuka lagi.');
    }
    function openProjectFile(file) {
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var data = JSON.parse(rd.result);
          if (!data || !Array.isArray(data.clips)) throw new Error('bad json');
          S.media = (data.media || []).map(function (m) { return { id: m.id, name: m.name, type: m.type, duration: m.duration || 0, w: m.w || 0, h: m.h || 0, thumbs: [], img: null, el: null, srcNode: null, url: null, missing: true }; });
          S.clips = data.clips;
          S.texts = data.texts || [];
          if (data.bg) S.bg = data.bg;
          if (data.pq) S.pq = data.pq;
          S.playhead = 0;
          S.playing = false;
          S.sel = null;
          recompute();
          renderAll();
          resizePreview();
          markDirty();
          toast('Project dimuat. Import ulang file media (nama harus sama) biar muncul lagi.');
        } catch (e) {
          toast('File project tidak valid', 'bad');
        }
      };
      rd.readAsText(file);
    }
    function autosave() {
      try {
        var data = {
          version: '0.1.0', savedAt: Date.now(), bg: S.bg, pq: S.pq,
          media: S.media.map(function (m) { return { id: m.id, name: m.name, type: m.type, duration: m.duration, w: m.w, h: m.h }; }),
          clips: S.clips, texts: S.texts
        };
        localStorage.setItem(LS_KEY, JSON.stringify(data));
        S.dirty = false;
      } catch (e) { }
    }
    function restoreDraft() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return;
        var data = JSON.parse(raw);
        if (!data || !Array.isArray(data.clips)) return;
        S.autosaveDraft = data;
        var note = document.createElement('div');
        note.id = 'v19-draft-note';
        note.style.cssText = 'position:fixed;top:54px;right:12px;z-index:8950;background:#161613;border:1px solid #d4ff3f;border-radius:10px;padding:10px 12px;font-family:IBM Plex Mono,monospace;font-size:10px;color:#f5f5f0;max-width:270px;box-shadow:0 10px 30px rgba(0,0,0,.5);';
        note.innerHTML = '<b style="color:#d4ff3f;">PROJECT TERSIMPAN</b> ditemukan (' + data.clips.length + ' clip, ' + (data.texts || []).length + ' teks).<br><br>' +
          '<button id="v19-draft-load" class="v19-btn" style="margin-right:6px;">LOAD</button>' +
          '<button id="v19-draft-clear" class="v19-btn danger">HAPUS</button>';
        document.body.appendChild(note);
        qs('#v19-draft-load').addEventListener('click', function () {
          S.media = (data.media || []).map(function (m) { return { id: m.id, name: m.name, type: m.type, duration: m.duration || 0, w: m.w || 0, h: m.h || 0, thumbs: [], img: null, el: null, srcNode: null, url: null, missing: true }; });
          S.clips = data.clips; S.texts = data.texts || []; S.bg = data.bg || '#050505';
          if (data.pq) S.pq = data.pq;
          S.playhead = 0; S.sel = null;
          recompute(); renderAll(); resizePreview(); markDirty();
          toast('Project dipulihkan. Import ulang media biar muncul.');
          note.remove();
        });
        qs('#v19-draft-clear').addEventListener('click', function () { localStorage.removeItem(LS_KEY); S.autosaveDraft = null; note.remove(); toast('Autosave dihapus'); });
      } catch (e) { }
    }

    /* ---------------- top bar & mode ---------------- */
    function buildBar() {
      if (qs('#v19-bar')) return;
      var bar = document.createElement('div');
      bar.id = 'v19-bar';
      bar.innerHTML = '' +
        '<div class="brand"><span class="logo">V</span><span class="bname">Video Editor</span><span class="chip">v0.1.0</span><span class="chip new">MP4 - 1080p60</span></div>' +
        '<span class="spacer"></span>' +
        '<span class="hint">potong - efek - animasi - subtitle - export MP4</span>';
      document.body.appendChild(bar);
    }
    function updateModeButtons() {
      var p = qs('#v19-mode-player'), e = qs('#v19-mode-editor');
      if (p) p.classList.toggle('on', S.mode === 'player');
      if (e) e.classList.toggle('on', S.mode === 'editor');
    }
    function applyModeClasses() {
      document.body.classList.toggle('v19-editor', S.mode === 'editor');
      document.body.classList.toggle('v19-player-mode', S.mode !== 'editor');
    }
    function setMode(m) {
      // v0.1.0: standalone — hanya ada mode editor.
      S.mode = 'editor';
      applyModeClasses();
      updateModeButtons();
      buildWorkspace();
      buildExportModal();
      renderAll();
      markDirty();          // render sekali; rAF hanya nyala saat play/export (hemat HP)
    }

    /* ---------------- global events ---------------- */
    function bindGlobal() {
      var dragC = 0;
      window.addEventListener('dragenter', function (e) {
        if (S.mode !== 'editor') return;
        if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1) { dragC++; showDropHint(true); }
      });
      window.addEventListener('dragover', function (e) {
        if (S.mode !== 'editor') return;
        e.preventDefault();
      });
      window.addEventListener('dragleave', function () { dragC--; if (dragC <= 0) { dragC = 0; showDropHint(false); } });
      window.addEventListener('drop', function (e) {
        dragC = 0; showDropHint(false);
        if (S.mode !== 'editor') return;
        e.preventDefault();
        var files = e.dataTransfer && e.dataTransfer.files;
        if (files && files.length) addFiles(files);
      });
      document.addEventListener('keydown', function (e) {
        if (S.mode !== 'editor') return;
        var tag = (e.target && e.target.tagName || '').toLowerCase();
        var typing = tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable);
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
          e.preventDefault(); e.stopPropagation();
          saveProjectFile();
          return;
        }
        if (e.key === 'Escape') {
          closeCtx();
          var md = qs('#v19-export-modal');
          if (md && md.style.display !== 'none') { closeExport(); e.preventDefault(); e.stopPropagation(); return; }
          var lm = qs('#v19-lines-modal');
          if (lm && lm.style.display !== 'none') { lm.style.display = 'none'; e.preventDefault(); e.stopPropagation(); return; }
          var hm = qs('#v19-help-modal');
          if (hm && hm.style.display !== 'none') { hm.style.display = 'none'; e.preventDefault(); e.stopPropagation(); return; }
          if (S.sel) { selectNone(); e.preventDefault(); e.stopPropagation(); return; }
          if (isMobile()) { closeDrawers(); e.preventDefault(); e.stopPropagation(); return; }
          return;
        }
        if (typing) return;
        var k = e.key;
        if (k === ' ') { e.preventDefault(); e.stopPropagation(); togglePlay(); return; }
        if (k === 'ArrowLeft') {
          e.preventDefault(); e.stopPropagation();
          if (e.shiftKey) { if (!nudgeSel(-0.1)) seek(S.playhead - 0.1); } else seek(S.playhead - 1);
          return;
        }
        if (k === 'ArrowRight') {
          e.preventDefault(); e.stopPropagation();
          if (e.shiftKey) { if (!nudgeSel(0.1)) seek(S.playhead + 0.1); } else seek(S.playhead + 1);
          return;
        }
        if (k === 'Home') { e.preventDefault(); e.stopPropagation(); seek(0); return; }
        if (k === 'End') { e.preventDefault(); e.stopPropagation(); seek(S.total); return; }
        if (k === 's' || k === 'S') { e.preventDefault(); e.stopPropagation(); splitAt(S.playhead); return; }
        if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); e.stopPropagation(); deleteSel(); return; }
        if (k === 'd' || k === 'D') { e.preventDefault(); e.stopPropagation(); duplicateSel(); return; }
        if (k === 'm' || k === 'M') {
          e.preventDefault(); e.stopPropagation();
          if (S.sel && S.sel.kind === 'clip') { var c = clipById(S.sel.id); if (c) { c.mute = !c.mute; updateMediaSeek(); renderInspector(); markDirty(); S.dirty = true; } }
          return;
        }
        if (k === 'i' || k === 'I') { e.preventDefault(); e.stopPropagation(); setInOut('in'); return; }
        if (k === 'o' || k === 'O') { e.preventDefault(); e.stopPropagation(); setInOut('out'); return; }
        if (k === 'e' || k === 'E') { e.preventDefault(); e.stopPropagation(); openExport(); return; }
        if (k === 'f' || k === 'F') { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); return; }
        if (k === '+' || k === '=') { e.preventDefault(); e.stopPropagation(); zoomBy(1.3); return; }
        if (k === '-' || k === '_') { e.preventDefault(); e.stopPropagation(); zoomBy(0.77); return; }
        if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); e.stopPropagation(); if (e.shiftKey) redo(); else undo(); return; }
      }, true);
      var unlocked = false;
      document.addEventListener('pointerdown', function () {
        if (S.mode !== 'editor' || unlocked) return;
        unlocked = true;
        var actx = ensureActx();
        if (actx && actx.state === 'suspended') actx.resume();
        S.media.forEach(function (m) { wireAudio(m); });
      }, true);
      setInterval(function () { if (S.dirty && S.mode === 'editor') autosave(); }, 3000);
    }
    function setInOut(which) {
      if (!S.sel) { toast('Pilih clip dulu', 'bad'); return; }
      if (S.sel.kind === 'clip') {
        var c = clipById(S.sel.id);
        if (!c) return;
        if (S.playhead <= c.start || S.playhead >= c.end) { toast('Playhead harus di dalam clip', 'bad'); return; }
        pushUndo();
        if (which === 'in') { c.in = c.in + (S.playhead - c.start) * c.rate; c.start = S.playhead; }
        else { c.out = c.in + (S.playhead - c.start) * c.rate; c.end = S.playhead; }
        recompute(); renderAll(); markDirty();
        toast(which === 'in' ? 'In point di-set' : 'Out point di-set');
      } else {
        var x = textById(S.sel.id);
        if (!x) return;
        pushUndo();
        if (which === 'in') x.start = S.playhead; else x.end = S.playhead;
        recompute(); renderAll(); markDirty();
        toast(which === 'in' ? 'Start teks di-set' : 'End teks di-set');
      }
    }
    function showDropHint(on) {
      var el = qs('#v19-drop-hint');
      if (!el) {
        el = document.createElement('div');
        el.id = 'v19-drop-hint';
        el.style.cssText = 'position:fixed;inset:0;z-index:9400;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(212,255,63,.10),rgba(0,0,0,.85));border:3px dashed #d4ff3f;pointer-events:none;font-family:Space Grotesk,sans-serif;font-size:26px;font-weight:700;color:#d4ff3f;letter-spacing:.1em;text-transform:uppercase;text-align:center;';
        el.innerHTML = 'DROP MP4 / VIDEO DI SINI<div style="font-family:IBM Plex Mono,monospace;font-size:12px;font-weight:400;color:#c8c8c0;text-transform:none;letter-spacing:0;margin-top:8px;">video - audio - gambar: langsung masuk timeline</div>';
        document.body.appendChild(el);
      }
      el.style.display = on ? 'flex' : 'none';
    }

    /* ---------------- debug handle ---------------- */
    window.__v19__ = {
      version: VERSION,
      S: S,
      addFiles: addFiles,
      drawComposition: drawComposition,
      exportSRT: exportSRT,
      saveProjectFile: saveProjectFile,
      openProjectFile: openProjectFile,
      splitAt: splitAt,
      setMode: setMode,
      renderAll: renderAll,
      selectClip: selectClip,
      setLoopA: setLoopA,
      setLoopB: setLoopB,
      toggleLoop: toggleLoop,
      togglePlay: togglePlay,
      nudgeSel: nudgeSel,
      openLinesModal: openLinesModal,
      openCtx: openCtx,
      resizePreview: resizePreview,
      openDrawer: openDrawer,
      closeDrawers: closeDrawers
    };
    window.__v18__ = window.__v19__;   // alias kompatibilitas

    /* ---------------- boot ---------------- */
    function boot() {
      injectCSS();
      buildBar();
      buildWorkspace();
      buildExportModal();
      bindGlobal();
      restoreDraft();
      S.mode = 'editor';
      applyModeClasses();
      updateModeButtons();
      toast('VIDEO EDITOR v0.1.0 siap - import MP4 / video / gambar buat mulai');
      console.info('%c[Video Editor v0.1.0] standalone - potong, efek, animasi, subtitle, export MP4 (preview adaptif, loop hemat, filter cache).', 'color:#d4ff3f;font-weight:bold;');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      setTimeout(boot, 50);
    }

  } catch (e) {
    try { console.error('[v19] init error:', e); } catch (e2) { }
  }
})();


    </script>
  </body>
